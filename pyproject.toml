[project]
name = "founderforge_ai"
version = "0.1.0"
description = "founderforge_ai using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]==1.15.0",
    "exa-py",
]

[project.scripts]
founderforge_ai = "founderforge_ai.main:run"
run_crew = "founderforge_ai.main:run"
train = "founderforge_ai.main:train"
replay = "founderforge_ai.main:replay"
test = "founderforge_ai.main:test"
run_with_trigger = "founderforge_ai.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
